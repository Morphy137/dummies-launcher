name: Checks

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/dummy-game -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:dummy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo fmt --manifest-path crates/dummy-game/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path crates/dummy-game/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path crates/dummy-game/Cargo.toml
