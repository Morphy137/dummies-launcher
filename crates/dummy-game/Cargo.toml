[package]
name = "dummy-game"
version = "1.0.0"
edition = "2024"
description = "Tiny hidden Win32 process used by Dummies"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
