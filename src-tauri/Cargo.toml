[package]
name = "dummies"
version = "1.0.1"
description = "A lightweight game presence launcher"
authors = ["Morphy137"]
license = "MIT"
repository = "https://github.com/Morphy137/dummies-launcher"
edition = "2024"
rust-version = "1.90"

[lib]
name = "dummies_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
sys-locale = "0.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
mslnk = "0.1.8"
winreg = "0.56.0"
tauri-plugin-opener = "2.7.2"
